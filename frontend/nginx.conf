# The web container's server. nginx does two things here: it serves the built
# frontend, and it forwards /api/* to the calculator service, so the page and
# the API share one origin. It does no authentication, rate limiting or
# routing between services: it is not an API gateway.
#
# This file replaces /etc/nginx/conf.d/default.conf, which the base image's
# nginx.conf includes inside its http block. That nginx.conf also puts the pid
# file and every temp directory in /tmp.

# Docker's embedded DNS. The calculator's address is looked up again while
# nginx runs (see `resolve` below), so a restarted container with a new IP is
# found, and nginx starts even when the calculator is not up yet.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream calculator {
    zone calculator 64k;
    server calculator:8081 resolve;
}

# One request ID per request, shared with the calculator's log line. A
# well-formed incoming X-Request-ID is kept; the pattern is the one the
# calculator accepts (httpapi/requestid.go), so both always log the same ID.
# Otherwise nginx makes one: $request_id is 32 hex characters.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default                 $request_id;
}

# Hashed build files never change, so they are cached for a year. index.html
# names the current hashes, so the browser must check it every time. API
# responses get no Cache-Control from nginx.
map $uri $cache_control {
    "~^/assets/" "public, max-age=31536000, immutable";
    "~^/api(/|$)" "";
    default      "no-cache";
}

log_format web '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
               '$request_time request_id=$req_id upstream=$upstream_status';

server {
    listen 8080;
    server_name _;
    # Not the base image's /usr/share/nginx/html, which also holds its own
    # index.html and 50x.html: only the build is served.
    root /usr/share/nginx/calculator;

    access_log /var/log/nginx/access.log web;
    server_tokens off;

    # Every add_header is here, and no location has its own: a location with
    # any add_header would drop all of these. `always` adds them to error
    # responses too, except Cache-Control: a 404 for a missing asset must not
    # be cached for a year.
    #
    # Every response carries the ID its request was logged under. On /api/ the
    # calculator's own copy is hidden (below), so there is exactly one.
    add_header X-Request-ID $req_id always;
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # Scripts, styles, images and API calls come only from this origin, with
    # no inline code. Base UI's ScrollArea would add an inline <style>; main.tsx
    # turns that off with CSPProvider, and index.css has the same rules. Fonts
    # are IBM Plex from Google Fonts: the stylesheet from fonts.googleapis.com,
    # the files from fonts.gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Compress the build's text files; text/html is always included. The API's
    # answers are far below the minimum length, so they are sent as they are.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The calculator's own limit is 4 KiB, and it answers a larger body with
    # its JSON INPUT_TOO_LARGE. nginx's limit sits well above that, so the
    # calculator's limit is the one that normally applies, and nginx's only
    # stops a body too large to be worth forwarding. The buffer is the same
    # size, so a body nginx accepts is never written to a temp file.
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    location /api/ {
        # No URI after the upstream name, so the path is forwarded unchanged:
        # /api/v1/calculate reaches the calculator as /api/v1/calculate.
        proxy_pass http://calculator;
        # Request headers are forwarded by default; this one is replaced, so
        # the calculator logs the ID nginx logs. The calculator sends it back
        # as X-Request-Id; that copy is hidden, and the add_header above sends
        # the same value once.
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;

        # The calculator is on the same Docker network, so a connection that
        # takes longer than 2 seconds means it is down. A calculation takes
        # milliseconds, so 5 seconds to send or answer is generous. 2 + 5
        # seconds also fits inside the 10-second stop grace period, so a
        # graceful stop never cuts off a request nginx is still waiting on.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Off is the default, stated because it matters: every response the
        # calculator sends, including its JSON 400, 404, 405, 413, 422 and 500,
        # passes through untouched. error_page below then applies only to
        # errors nginx generates itself.
        proxy_intercept_errors off;

        # nginx's own errors in the service's JSON format (CLAUDE.md rule 5).
        # 502: no address for the calculator (it is stopped, so Docker's DNS
        # does not know it), a refused connection or a broken response. 504: no
        # connection or no answer in time. 503 is included so that any other
        # nginx-made unavailability looks the same. All are 503 to clients: the
        # `=503` is needed, because after an error_page redirect nginx keeps the
        # original status, whatever the named location returns. A 413 stays 413.
        error_page 502 503 504 =503 @service_unavailable;
        error_page 413 @input_too_large;
    }

    # Without this, nginx answers /api with a redirect to /api/. The JSON 404
    # matches what the calculator sends for any other unknown path.
    location = /api {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"There is nothing at /api."}}\n';
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The calculator service is unavailable. Try again shortly."}}\n';
    }

    location @input_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"INPUT_TOO_LARGE","message":"The request body is too large."}}\n';
    }

    # Health check for this container only: nginx is up and serving. It does
    # not call the calculator, which has its own health check.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    # Hashed build output. A missing file is a 404, not index.html: an old
    # page asking for a chunk that no longer exists must not get HTML back,
    # least of all with a year-long cache.
    location /assets/ {
        try_files $uri =404;
    }

    # Every other path is the single-page app: a file if one exists, else
    # index.html.
    location / {
        try_files $uri /index.html;
    }
}

# nginx serves the built frontend and forwards /api/* to the calculator, so the
# page and the API share one origin. It does no authentication, rate limiting
# or routing between services, so it is not an API gateway.
#
# The base image's nginx.conf includes this as conf.d/default.conf, inside its
# http block.

# Docker's DNS. With `resolve` below, nginx looks the calculator up again while
# running, so it can start first and still finds a restarted container's new IP.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream calculator {
    zone calculator 64k;
    server calculator:8081 resolve;
}

# Keep a client's X-Request-ID when it matches the pattern the calculator
# accepts (httpapi/requestid.go), else use nginx's, so both log the same ID.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default                 $request_id;
}

# Hashed assets never change. index.html names the current hashes, so the
# browser has to recheck it every time.
map $uri $cache_control {
    "~^/assets/" "public, max-age=31536000, immutable";
    "~^/api(/|$)" "";
    default      "no-cache";
}

# swagger-ui.css draws its icons as data: SVGs, so /docs/ allows data: images.
map $uri $img_src {
    "~^/docs/" "'self' data:";
    default    "'self'";
}

log_format web '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
               '$request_time request_id=$req_id upstream=$upstream_status';

server {
    listen 8080;
    server_name _;
    # The base image's html directory has its own sample pages.
    root /usr/share/nginx/calculator;

    access_log /var/log/nginx/access.log web;
    server_tokens off;

    # Every add_header lives here because a location with any add_header of its
    # own drops all of these. `always` covers error responses too, except for
    # Cache-Control, so a 404 for a missing asset is not cached for a year.
    add_header X-Request-ID $req_id always;
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    # No inline code is allowed, so main.tsx turns off Base UI's ScrollArea
    # <style> with CSPProvider and index.css has the same rules.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src $img_src; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # text/html is always compressed, so it is not listed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The calculator's 4 KiB limit is the one that normally applies, with its
    # JSON INPUT_TOO_LARGE. nginx's limit only stops bodies not worth forwarding,
    # and the matching buffer keeps accepted bodies out of temp files.
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    location /api/ {
        # No URI after the upstream name, so the path is forwarded unchanged.
        proxy_pass http://calculator;
        # The calculator logs the same ID as nginx. Its echoed copy is hidden so
        # the add_header above sends the value once.
        proxy_set_header X-Request-ID $req_id;
        proxy_hide_header X-Request-ID;

        # A calculation takes milliseconds, so these are generous. 2 + 5 seconds
        # also fits the 10-second stop grace period, so a graceful stop never
        # cuts off a request nginx is waiting on.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # Already the default. Written out because the calculator's JSON errors
        # must pass through untouched, leaving error_page to nginx's own errors.
        proxy_intercept_errors off;

        # nginx's own errors in the service's JSON format (CLAUDE.md rule 5).
        # 502 and 504 mean the calculator is stopped, refused the connection,
        # sent a broken response or was too slow. `=503` is needed because nginx
        # otherwise keeps the original status after an error_page redirect.
        # A 413 stays 413.
        error_page 502 503 504 =503 @service_unavailable;
        error_page 413 @input_too_large;
    }

    # Without this, nginx redirects /api to /api/. The 404 matches the one the
    # calculator sends for unknown paths.
    location = /api {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"There is nothing at /api."}}\n';
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"The calculator service is unavailable. Try again shortly."}}\n';
    }

    location @input_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"INPUT_TOO_LARGE","message":"The request body is too large."}}\n';
    }

    # This container only. It does not call the calculator, which has its own.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    # Swagger UI, copied in by the Dockerfile. The redirect is relative so it
    # works on whatever port is published.
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
    }

    # An old page asking for a chunk that is gone must get a 404, never
    # index.html with a year-long cache.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

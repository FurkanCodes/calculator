services:
  web:
    # The repo root, because the frontend type check reads testdata/numbers.json.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # The only way in, and only from this machine. WEB_PORT in .env sets the host port.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      # nginx's own /healthz, which does not call the calculator.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # nginx's proxy timeouts (2 s + 5 s) let in-flight requests finish in time.
    stop_grace_period: 10s
    restart: unless-stopped
    read_only: true
    # The only place nginx writes, for its pid file and temp files.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  calculator:
    build: ./backend
    environment:
      PORT: "8081"
    # No ports. Only web reaches it, over the Compose network.
    healthcheck:
      # The image has no shell or curl, so the binary checks itself.
      test: ["CMD", "/calculator", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # The service shuts down within 5 seconds.
    stop_grace_period: 10s
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
